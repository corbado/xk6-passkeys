name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: 1.26.x
          cache-dependency-path: |
            go.sum
            examples/backend/go.sum
      - name: Build pinned k6
        run: |
          make build
          ./k6 version
      - name: Run Docker integration checks
        run: bash scripts/smoke-test.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: 1.26.x
          cache-dependency-path: |
            go.sum
            examples/backend/go.sum
      - name: Test both Go modules
        run: |
          go test -race -timeout 60s .
          cd examples/backend
          go test -race -timeout 60s ./...
